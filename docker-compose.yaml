version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: BjjTrack-test
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    restart: always


  redis:
    image: redis:latest
    container_name: BjjTrack-redis-test
    ports:
      - "6379:6379"
    restart: always
volumes:
  redis-data:
    driver: local